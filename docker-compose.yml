version: '3.8'

services:
  bot:
    build: .
    container_name: teras
    environment:
      - TZ=Asia/Jakarta
      - WEBHOOK_FORWARD_URL=${WEBHOOK_FORWARD_URL:-http://bantu-backend-rust:25333/api/v1/webhook/telegram}
    env_file:
      - .env
    ports:
      - "25336:3001"
    restart: unless-stopped
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - default

volumes:
  telegram-bot-api-data:
    name: telegram-bot-api-data
    external: true

networks:
  default:
    name: satuarah-network
    external: true
