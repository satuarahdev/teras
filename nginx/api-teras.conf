map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream teras_api {
    keepalive 64;
    server 127.0.0.1:25336;
}

# Server HTTP (Redirect ke HTTPS)
server {
    listen 80;
    server_name api-teras.satuarah.id;
    return 301 https://$host$request_uri;
}

# Server HTTPS
server {
    listen 443 ssl http2;
    server_name api-teras.satuarah.id;
    
    # SSL Certificate Configuration
    ssl_certificate /etc/ssl/satuarah.id/fullchain.pem;
    ssl_certificate_key /etc/ssl/satuarah.id/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;
    
    # Logs Nginx
    access_log /var/log/nginx/api_teras_satuarah_access.log;
    error_log /var/log/nginx/api_teras_satuarah_error.log;
    
    # Client limits & Timeouts (Supports up to 2GB files)
    client_max_body_size 2048M;
    client_body_timeout 1800s;
    client_header_timeout 300s;
    send_timeout 1800s;
    keepalive_timeout 60s;
    
    # Proxy timeouts & settings
    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    limit_req_status 429;
    limit_conn_status 429;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Semua request diteruskan ke Teras API
    location / {
        limit_req zone=rl_default burst=60 nodelay;
        limit_conn conn_per_ip 20;
        
        proxy_pass http://teras_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
